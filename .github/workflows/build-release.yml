name: Build and Release Plugin

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Compute Version
        id: version_info
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION="1.0.5.0"
          fi
          # Ensure 4-digit version format for Jellyfin (e.g. 1.0.4 -> 1.0.4.0)
          DOT_COUNT=$(echo "$VERSION" | tr -cd '.' | wc -c)
          if [ "$DOT_COUNT" -eq 2 ]; then
            FULL_VERSION="${VERSION}.0"
          else
            FULL_VERSION="$VERSION"
          fi
          echo "full_version=$FULL_VERSION" >> $GITHUB_OUTPUT

      - name: Build in Release mode
        run: dotnet build -c Release -p:Version=${{ steps.version_info.outputs.full_version }} -p:AssemblyVersion=${{ steps.version_info.outputs.full_version }} -p:FileVersion=${{ steps.version_info.outputs.full_version }}

      - name: Prepare Release Package
        id: package
        run: |
          FULL_VERSION="${{ steps.version_info.outputs.full_version }}"
          ZIP_NAME="Jellyfin.Plugin.LiveTvCleaner_${FULL_VERSION}.zip"
          zip -j "$ZIP_NAME" bin/Release/net9.0/Jellyfin.Plugin.LiveTvCleaner.dll
          
          CHECKSUM=$(md5sum "$ZIP_NAME" | awk '{print $1}')
          
          echo "zip_name=$ZIP_NAME" >> $GITHUB_OUTPUT
          echo "version=$FULL_VERSION" >> $GITHUB_OUTPUT
          echo "checksum=$CHECKSUM" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ steps.package.outputs.zip_name }}
          generate_release_notes: true

      - name: Update and push manifest.json to main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Switch to main and fetch latest commits to avoid race conditions
          git fetch origin main
          git checkout main
          git pull origin main --rebase

          python3 -c "
          import json, datetime

          with open('manifest.json', 'r') as f:
              data = json.load(f)

          plugin = data[0]
          tag = '${{ github.ref_name }}'
          version = '${{ steps.package.outputs.version }}'
          checksum = '${{ steps.package.outputs.checksum }}'
          zip_name = '${{ steps.package.outputs.zip_name }}'

          new_version = {
              'version': version,
              'changelog': f'Release {tag}',
              'targetAbi': '10.10.0.0',
              'sourceUrl': f'https://github.com/${{ github.repository }}/releases/download/{tag}/{zip_name}',
              'checksum': checksum,
              'timestamp': datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ')
          }

          # Avoid duplicate versions
          plugin['versions'] = [v for v in plugin.get('versions', []) if v.get('version') != version]
          plugin['versions'].insert(0, new_version)

          with open('manifest.json', 'w') as f:
              json.dump(data, f, indent=2)
          "

          git add manifest.json
          if ! git diff --quiet --staged; then
            git commit -m "chore(release): update manifest.json for ${{ github.ref_name }}"
            git pull --rebase origin main
            git push origin main
            curl -s "https://purge.jsdelivr.net/gh/${{ github.repository }}@main/manifest.json" || true
          fi
